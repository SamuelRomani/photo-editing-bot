[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "photobot"
version = "0.1.0"
description = "Edição automática de fotos para Instagram"
requires-python = ">=3.10"
dependencies = ["pillow>=10.0", "numpy>=1.26", "opencv-python-headless>=4.9"]

[project.optional-dependencies]
app = ["gradio>=5.0"]
ia = ["rembg>=2.0.50", "onnxruntime>=1.17", "opencv-contrib-python-headless>=4.9"]

[project.scripts]
photobot = "photobot.cli:main"
photobot-app = "photobot.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
photobot = ["acabamentos/*.json"]

[tool.pytest.ini_options]
pythonpath = ["src"]
markers = ["rede: baixa modelos da internet na primeira execução"]
