[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "photobot"
version = "0.1.0"
description = "Edição automática de fotos para Instagram"
requires-python = ">=3.10"
dependencies = ["pillow>=10.0", "numpy>=1.26", "opencv-python-headless>=4.9"]

[project.scripts]
photobot = "photobot.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
